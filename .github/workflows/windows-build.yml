name: Windows build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore NuGet packages
        run: dotnet restore OpenNotch.csproj --runtime win-x64 -p:SelfContained=true

      - name: Build Release
        run: dotnet build OpenNotch.csproj --configuration Release --runtime win-x64 --no-restore -p:SelfContained=true

      - name: Publish self-contained Windows app
        run: dotnet publish OpenNotch.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output publish

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path ".\publish\*" -DestinationPath ".\OpenNotch-win-x64-unsigned.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenNotch-win-x64-unsigned
          path: OpenNotch-win-x64-unsigned.zip
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v8
        with:
          name: OpenNotch-win-x64-unsigned
          path: release-assets

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          name: OpenNotch ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Automated self-contained Windows x64 build of OpenNotch.

            **Important:** This build is currently unsigned. Windows Smart App Control or other application-control policies may block it. Do not disable Windows security protections to run this build. Trusted code signing will be handled separately.
          files: release-assets/OpenNotch-win-x64-unsigned.zip
